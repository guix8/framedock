[Service]
EnvironmentFile=-%h/.config/framecolor/vulkan.env
# The guard always exits 0 on start (see the script); a guard that is missing or not executable mustn't keep
# SteamVR from starting either ($$0 is the guard's path)
ExecCondition=/bin/sh -c '[ -x "$$0" ] || exit 0; exec "$$0" start' %h/.local/libexec/framecolor-guard
ExecStopPost=-%h/.local/libexec/framecolor-guard stop
